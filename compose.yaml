services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_DB: portfolio
      POSTGRES_PASSWORD: ${PGPASSWORD:?Run the environment setup first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "portfolio", "-d", "portfolio"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      PGHOST: db
      PGUSER: portfolio
      PGDATABASE: portfolio
      PGPASSWORD: ${PGPASSWORD:?Run the environment setup first}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  pgdata:
